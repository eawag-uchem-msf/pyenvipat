# Python port of R package enviPat (Loos, Gerber et al., EAWAG),
# licensed GPL-2.0-only, same as upstream. See AUTHORS and NOTICE.
[build-system]
requires = ["setuptools>=68", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "pyEnvipat"
version = "0.2.0"
description = "Isotope pattern, profile and centroid calculation for mass spectrometry -- Python port of the R package enviPat (Loos, Gerber et al., EAWAG), GPL-2.0-only"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
authors = [
    { name = "Martin Loos" },
    { name = "Christian Gerber" },
    { name = "Johannes Boog", email = "johannesboog@yahoo.de" },
]
maintainers = [
    { name = "Johannes Boog", email = "johannesboog@yahoo.de" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://www.envipat.eawag.ch/"
Repository = "https://gitlab.eawag.ch/joboog/pyenvipat"
"Original R Package" = "https://github.com/blosloos/enviPat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envipat = ["data/*.csv", "data/*.txt"]
