# Python port of R package enviPat (Loos, Gerber et al., EAWAG),
# licensed GPL-2.0-only, same as upstream. See AUTHORS and NOTICE.
[build-system]
# setuptools>=77.0.3: PEP 639 license expression + license-files. numpy>=2.0: the
# extension is compiled against numpy 2 headers, which also run on numpy 1.x at runtime.
requires = ["setuptools>=77.0.3", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyEnvipat"
# Single source of truth: envipat.__version__ ([tool.setuptools.dynamic] below).
dynamic = ["version"]
description = "Isotope pattern, profile and centroid calculation for mass spectrometry"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
keywords = [
    "mass spectrometry",
    "isotope pattern",
    "isotopic fine structure",
    "envelope",
    "centroid",
    "chemistry",
    "enviPat",
]
# No `License ::` classifier: deprecated next to a license expression (PEP 639).
# `Private :: Do Not Upload` makes PyPI reject uploads until publishing is set up (#31).
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
authors = [
    { name = "Johannes Boog", email = "johannesboog@yahoo.de" },
    { name = "Martin Loos" },
    { name = "Christian Gerber" }
]
maintainers = [
    { name = "Johannes Boog", email = "johannesboog@yahoo.de" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=6",
]
dev = [
    "pyEnvipat[test]",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pandas-stubs",
    "scipy-stubs",
    "nox>=2025.2.9",
    "pre-commit>=4",
    "build>=1.2",
    "twine>=6",
    "pip-audit>=2.7",
]
# Sphinx site under docs/ (nox -s docs); myst-nb executes docs/*.ipynb on every
# build, which needs a Jupyter kernel and matplotlib for the plots.
docs = [
    "sphinx>=8",
    "furo",
    "numpydoc>=1.8",
    "myst-nb>=1.1",
    "ipykernel",
    "matplotlib>=3.7",
]

# Well-known labels (packaging.python.org well-known-project-urls); switch to GitHub in #31.
[project.urls]
Homepage = "https://www.envipat.eawag.ch/"
Source = "https://gitlab.eawag.ch/uchem/msf-server/pyenvipat"
Issues = "https://gitlab.eawag.ch/uchem/msf-server/pyenvipat/-/issues"
Changelog = "https://gitlab.eawag.ch/uchem/msf-server/pyenvipat/-/blob/main/CHANGELOG.md"
"Original R Package" = "https://github.com/blosloos/enviPat"

[tool.setuptools.packages.find]
where = ["src"]

# Read statically from the source (no import), so the build never needs the extension.
[tool.setuptools.dynamic]
version = { attr = "envipat.__version__" }

[tool.setuptools.package-data]
envipat = ["py.typed", "_core/*.pyi", "data/*.csv", "data/*.txt"]

# --------------------------------------------------------------------- #
# Tooling. CI (.gitlab-ci.yml) and pre-commit run these via noxfile.py.
# --------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/envipat"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
# Catch new uses of arguments pandas 3 deprecates (pandas 2.x has no Pandas4Warning
# class, so match the message instead of the category).
filterwarnings = ["error:The 'float_precision' argument is deprecated"]

[tool.cibuildwheel]
# Binary wheels for CPython 3.10-3.13. Linux (#21): manylinux_2_28 + musllinux_1_2,
# x86_64 only (aarch64 would need emulation or arm runners). Windows (#22) and
# macOS (#23) wheels need CI runners for those platforms.
build = "cp310-* cp311-* cp312-* cp313-*"
archs = ["native"]
build-frontend = "build"
# Every wheel is installed into a fresh environment and has to pass the full suite,
# including the golden fixtures under tests/.
test-extras = ["test"]
test-command = "pytest {project}/tests -p no:cacheprovider"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"

[tool.coverage.run]
source = ["envipat"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
