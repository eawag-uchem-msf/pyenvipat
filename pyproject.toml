# Python port of R package enviPat (Loos, Gerber et al., EAWAG),
# licensed GPL-2.0-only, same as upstream. See AUTHORS and NOTICE.
[build-system]
requires = ["setuptools>=68", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "pyEnvipat"
version = "0.2.0"
description = "Isotope pattern, profile and centroid calculation for mass spectrometry"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
authors = [
    { name = "Johannes Boog", email = "johannesboog@yahoo.de" },
    { name = "Martin Loos" },
    { name = "Christian Gerber" }
]
maintainers = [
    { name = "Johannes Boog", email = "johannesboog@yahoo.de" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=6",
]
dev = [
    "pyEnvipat[test]",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pandas-stubs",
    "scipy-stubs",
    "nox>=2025.2.9",
    "pre-commit>=4",
    "build>=1.2",
    "twine>=6",
]
# Placeholder toolchain; the docs site itself (Sphinx vs. MkDocs) is #28.
docs = [
    "sphinx>=8",
    "furo",
    "numpydoc>=1.8",
]

[project.urls]
Homepage = "https://www.envipat.eawag.ch/"
Repository = "https://gitlab.eawag.ch/uchem/msf-server/pyenvipat"
"Original R Package" = "https://github.com/blosloos/enviPat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envipat = ["data/*.csv", "data/*.txt"]

# --------------------------------------------------------------------- #
# Tooling. CI (.gitlab-ci.yml) and pre-commit run these via noxfile.py.
# --------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/envipat"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

# The compiled extension has no stub yet (.pyi is tracked in #24).
[[tool.mypy.overrides]]
module = ["envipat._core.enviPat_py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
source = ["envipat"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
