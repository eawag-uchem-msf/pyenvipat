# Release pipeline for a v* tag: build sdist + Linux/Windows/macOS wheels, publish
# them as a GitHub Release with a SHA256SUMS file, then upload to PyPI via trusted
# publishing (pypa/gh-action-pypi-publish), gated by the `pypi` environment's
# required reviewer. Who may create a v* tag at all is enforced by the repo's tag
# ruleset, not by this workflow.
#
# Run manually (workflow_dispatch) for a dry run: the same sdist + wheels are
# uploaded to TestPyPI via the `testpypi` environment instead; no tag check, no
# GitHub Release, no PyPI upload.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s release_check -- "${{ github.ref_name }}"

  build:
    needs: [release-check]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s build
      # Only the sdist: the session's plain linux_x86_64 wheel is not distributable
      # (PyPI rejects it); the cibuildwheel wheels replace it.
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  wheels:
    needs: [release-check]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-manylinux, os: ubuntu-latest, cibw-skip: "*-musllinux_*" }
          - { name: linux-musllinux, os: ubuntu-latest, cibw-skip: "*-manylinux_*" }
          - { name: windows-amd64, os: windows-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_SKIP: ${{ matrix.cibw-skip }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  # Collects the sdist and all wheels with a SHA256SUMS file as a GitHub Release's
  # assets, kept indefinitely.
  github-release:
    if: github.event_name == 'push'
    needs: [build, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
          path: release
      - working-directory: release
        run: sha256sum * | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: pyEnvipat ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true

  publish:
    if: github.event_name == 'push'
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The same sdist + wheels as the GitHub Release (no SHA256SUMS).
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # Dry run: TestPyPI rejects re-uploading a version, so files already there are
  # skipped and the run can be repeated for the same version. The status check is
  # needed because a plain `if` implies success(), which is false when an upstream
  # job (release-check) was skipped.
  publish-testpypi:
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [build, wheels]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true
