# Binary wheels for CPython 3.10-3.13 (config in [tool.cibuildwheel], pyproject.toml),
# each built natively on its runner and tested against the full suite in a fresh
# environment: manylinux_2_28 / musllinux_1_2 x86_64 (in containers), win_amd64,
# macOS x86_64 (Intel runner) and arm64 (Apple Silicon runner).

name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-manylinux, os: ubuntu-latest, cibw-skip: "*-musllinux_*" }
          - { name: linux-musllinux, os: ubuntu-latest, cibw-skip: "*-manylinux_*" }
          - { name: windows-amd64, os: windows-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_SKIP: ${{ matrix.cibw-skip }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          retention-days: 7
