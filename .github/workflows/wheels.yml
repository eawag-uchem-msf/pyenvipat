# manylinux_2_28 / musllinux_1_2 x86_64 wheels for CPython 3.10-3.13 (config in
# [tool.cibuildwheel], pyproject.toml); each wheel is tested in its own container.
# Windows and macOS wheels are tracked in issues #22 / #23, not built here yet.

name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cibw-skip: ["*-musllinux_*", "*-manylinux_*"]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_SKIP: ${{ matrix.cibw-skip }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          retention-days: 7
