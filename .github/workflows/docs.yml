# Sphinx site (docs/, `nox -s docs`): warnings are errors and the tutorial notebook is
# executed, so a broken example or cross-reference fails the PR. Every run keeps the
# HTML as an artifact for review; pushes to main also deploy it to GitHub Pages
# (repo Settings > Pages > Source: GitHub Actions). Replaces the GitLab `docs` and
# `pages` jobs, which the move to GitHub Actions had not carried over.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s docs
      - uses: actions/upload-artifact@v4
        with: { name: docs-html, path: docs/_build/html/, retention-days: 7 }
      # Coverage badge for the README: a shields.io endpoint JSON served from the
      # Pages site (coverage-badge.json), so no third-party coverage service is
      # needed. Main pushes only; same session and Python as one CI `tests` job.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nox -s tests-3.12
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Write coverage badge
        run: |
          python - <<'EOF'
          import json
          import xml.etree.ElementTree as ET

          pct = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          # Green at/above [tool.coverage.report] fail_under (85).
          color = (
              "brightgreen" if pct >= 90 else "green" if pct >= 85
              else "yellow" if pct >= 75 else "red"
          )
          badge = {"schemaVersion": 1, "label": "coverage",
                   "message": f"{pct:.0f}%", "color": color}
          with open("docs/_build/html/coverage-badge.json", "w") as f:
              json.dump(badge, f)
          print(badge)
          EOF
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: docs/_build/html/ }

  # Publishes the build job's HTML (no rebuild) from main only.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment halfway; a newer one waits for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
