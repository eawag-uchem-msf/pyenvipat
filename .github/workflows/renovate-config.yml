# renovate.json must pass the validator of the Renovate version actually running it
# (the Renovate GitHub App); Renovate bumps the version below itself (custom regex
# manager in renovate.json). Locally: nox -s renovate_check (needs Node.js).

name: Renovate config

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate-config.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate-config.yml]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes --package renovate@44 -- renovate-config-validator --strict
