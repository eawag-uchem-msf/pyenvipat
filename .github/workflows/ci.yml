# Quality, test and build pipeline. Every job except `tests` calls a nox session
# (noxfile.py), so CI and local runs match: nox -s lint format typecheck tests build.
# Linux wheels are built separately (wheels.yml); release artifacts and PyPI
# publishing run from release.yml on v* tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s lint
      - run: nox -s format -- --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s typecheck

  # Every PR must raise envipat.__version__ above the base branch's (the docs and
  # the package metadata read it from there). Renovate PRs only touch tooling and
  # CI images, never the package.
  version-bump:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s version_bump -- origin/${{ github.base_ref }}

  # Known vulnerabilities in the runtime dependencies (the resolved numpy/pandas/scipy
  # stack), not in dev tooling.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s audit

  # Our own C files (iso_core.c, enviPat_py.c) with -Wall -Wextra -Werror; the
  # vendored files' warnings are triaged in setup.py.
  cwarnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s cwarnings

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install nox uv
      - name: Run tests
        run: nox -s "tests-${{ matrix.python-version }}" | tee pytest-output.txt
      - name: Add coverage to job summary
        if: always()
        run: grep '^TOTAL' pytest-output.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml
          retention-days: 7

  # Full test suite against an AddressSanitizer + UndefinedBehaviorSanitizer build of
  # the C extension (GCC). Any finding aborts the run. Pinned to the same python:3.12
  # image GitLab CI used (not ubuntu-latest, like the other jobs): the golden-fixture
  # comparison in tests/test_core.py is exact equality, and a newer GCC's codegen for
  # the ASan/UBSan build (only that build, not the plain one) diverges by ~1 ULP from
  # the fixtures on ubuntu-latest's default toolchain.
  sanitize:
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - run: pip install nox uv
      - run: nox -s sanitize

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nox uv
      - run: nox -s build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/, retention-days: 7 }
