# CI pipeline. Every job except the wheel build calls a nox session (noxfile.py), so
# CI and local runs match:  nox -s lint format typecheck cwarnings tests sanitize build
# Jobs run in the standard python images, which ship the C compiler the extension needs.
# Linux wheels (#21) are built with cibuildwheel ([tool.cibuildwheel] in pyproject.toml).
# Windows (#22) and macOS (#23) jobs need runners for those platforms (none yet).
# Docs (#28) are built by `docs` and published to GitLab Pages by `pages` on main.
# Releases (#26): a protected tag vX.Y.Z runs the whole pipeline plus `release-check`
# and `release`, which keeps the sdist and wheels as artifacts (no upload; PyPI is #31).

stages: [quality, test, build, deploy]

# Merge request pipelines instead of a second push pipeline while an MR is open; branch
# pipelines (default branch, web runs) and tag pipelines are unchanged.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

default:
  image: python:3.12
  interruptible: true

variables:
  CI: "true"
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.nox:
  cache:
    key:
      files: [pyproject.toml]
      prefix: nox-$CI_JOB_NAME_SLUG
    paths: [.cache/pip/, .cache/uv/]
  before_script:
    - pip install nox uv

lint:
  extends: .nox
  stage: quality
  script:
    - nox -s lint
    - nox -s format -- --check

typecheck:
  extends: .nox
  stage: quality
  script:
    - nox -s typecheck

# Every MR must raise envipat.__version__ above the target branch's (the docs and the
# package metadata read it from there). The job clone is shallow, so fetch the target.
version-bump:
  extends: .nox
  stage: quality
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - nox -s version_bump -- FETCH_HEAD

# Known vulnerabilities in the runtime dependencies (the resolved numpy/pandas/scipy
# stack), not in dev tooling.
audit:
  extends: .nox
  stage: quality
  script:
    - nox -s audit

# Release tags only: the tag must be protected (Settings > Repository > Protected tags,
# pattern v*) and equal v<__version__>, and CITATION.cff must agree. Fails before the
# wheels are built.
release-check:
  extends: .nox
  stage: quality
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - |
      if [ "$CI_COMMIT_REF_PROTECTED" != "true" ]; then
        echo "tag $CI_COMMIT_TAG is not protected; protect v* tags before releasing" >&2
        exit 1
      fi
    - nox -s release_check -- "$CI_COMMIT_TAG"

# Our own C files (iso_core.c, enviPat_py.c) with -Wall -Wextra -Werror; the vendored
# files' warnings are triaged in setup.py.
c-warnings:
  extends: .nox
  stage: quality
  script:
    - nox -s cwarnings

test:
  extends: .nox
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    # The image's interpreter is the only one available, so run its matching session.
    - nox -s "tests-$PYTHON_VERSION"
  coverage: '/^TOTAL\s.*?(\d+(?:\.\d+)?)%\s*$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Full test suite against an AddressSanitizer + UndefinedBehaviorSanitizer build of the
# C extension (GCC). Any finding aborts the run.
sanitize:
  extends: .nox
  stage: test
  script:
    - nox -s sanitize

build:
  extends: .nox
  stage: build
  script:
    - nox -s build
  artifacts:
    expire_in: 1 week
    paths: [dist/]

# manylinux_2_28 / musllinux_1_2 x86_64 wheels for CPython 3.10-3.13; each wheel is
# tested in its own container. cibuildwheel drives docker, hence docker-in-docker.
wheels:linux:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    # The runner does not share a /certs volume between job and service, so dind
    # runs without TLS; it is only reachable on the job's own service network.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    CIBW_BUILD_VERBOSITY: "1"
  parallel:
    matrix:
      - CIBW_SKIP: ["*-musllinux_*", "*-manylinux_*"]
  before_script:
    - apk add --no-cache python3
    - python3 -m venv /opt/cibw
    - /opt/cibw/bin/pip install cibuildwheel==4.3.5
  script:
    - /opt/cibw/bin/cibuildwheel --platform linux --output-dir wheelhouse
  artifacts:
    expire_in: 1 week
    paths: [wheelhouse/]

# Sphinx site (docs/), warnings are errors; the tutorial notebook is executed during the
# build. The HTML is kept so reviewers can browse an MR's docs from the job artifacts.
docs:
  extends: .nox
  stage: build
  script:
    - nox -s docs
  artifacts:
    expire_in: 1 week
    paths: [docs/_build/html/]

# GitLab Pages: publish the docs job's build (no rebuild) from the default branch only.
pages:
  stage: deploy
  image: alpine:3.22
  needs: [docs]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: []
  script:
    - mv docs/_build/html public
  artifacts:
    paths: [public]

# Release artifacts for a v* tag: the sdist from `build` (its plain linux_x86_64 wheel is
# not distributable) and the manylinux/musllinux wheels, with SHA-256 sums. Kept
# indefinitely; nothing is uploaded.
# Windows (#22) and macOS (#23) wheels join here once those jobs exist.
release:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  needs: [release-check, build, wheels:linux]
  cache: []
  script:
    - mkdir -p release
    - cp dist/*.tar.gz wheelhouse/*.whl release/
    - cd release && sha256sum * | tee SHA256SUMS
  artifacts:
    name: pyEnvipat-$CI_COMMIT_TAG
    expire_in: never
    paths: [release/]
