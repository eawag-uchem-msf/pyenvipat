# CI pipeline. Every job except the wheel build calls a nox session (noxfile.py), so
# CI and local runs match:  nox -s lint format typecheck cwarnings tests sanitize build
# Jobs run in the standard python images, which ship the C compiler the extension needs.
# Linux wheels (#21) are built with cibuildwheel ([tool.cibuildwheel] in pyproject.toml).
# Windows (#22) and macOS (#23) jobs need runners for those platforms (none yet).
# Docs (#28) are built by `docs` and published to GitLab Pages by `pages` on main.
# Renovate (#33, renovate.json) runs from a weekly pipeline schedule with RENOVATE=true;
# that pipeline runs only the `renovate` job. Setup: CONTRIBUTING.md.

stages: [quality, test, build, deploy]

# Merge request pipelines instead of a second push pipeline while an MR is open; branch
# pipelines (default branch, web runs) and tag pipelines are unchanged.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

default:
  image: python:3.12
  interruptible: true

variables:
  CI: "true"
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Every job except `renovate` skips the Renovate schedule (RENOVATE=true).
.nox:
  rules:
    - if: $RENOVATE == "true"
      when: never
    - when: on_success
  cache:
    key:
      files: [pyproject.toml]
      prefix: nox-$CI_JOB_NAME_SLUG
    paths: [.cache/pip/, .cache/uv/]
  before_script:
    - pip install nox uv

lint:
  extends: .nox
  stage: quality
  script:
    - nox -s lint
    - nox -s format -- --check

typecheck:
  extends: .nox
  stage: quality
  script:
    - nox -s typecheck

# Every MR must raise envipat.__version__ above the target branch's (the docs and the
# package metadata read it from there). The job clone is shallow, so fetch the target.
version-bump:
  extends: .nox
  stage: quality
  rules:
    # Renovate MRs only touch tooling and CI images, never the package.
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - nox -s version_bump -- FETCH_HEAD

# renovate.json must pass the validator of the Renovate version that runs it. Locally:
# nox -s renovate_check (needs Node.js).
renovate-config:
  stage: quality
  image: ghcr.io/renovatebot/renovate:44
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [renovate.json]
  cache: []
  script:
    - renovate-config-validator --strict

# Our own C files (iso_core.c, enviPat_py.c) with -Wall -Wextra -Werror; the vendored
# files' warnings are triaged in setup.py.
c-warnings:
  extends: .nox
  stage: quality
  script:
    - nox -s cwarnings

test:
  extends: .nox
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    # The image's interpreter is the only one available, so run its matching session.
    - nox -s "tests-$PYTHON_VERSION"
  coverage: '/^TOTAL\s.*?(\d+(?:\.\d+)?)%\s*$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Full test suite against an AddressSanitizer + UndefinedBehaviorSanitizer build of the
# C extension (GCC). Any finding aborts the run.
sanitize:
  extends: .nox
  stage: test
  script:
    - nox -s sanitize

build:
  extends: .nox
  stage: build
  script:
    - nox -s build
  artifacts:
    expire_in: 1 week
    paths: [dist/]

# manylinux_2_28 / musllinux_1_2 x86_64 wheels for CPython 3.10-3.13; each wheel is
# tested in its own container. cibuildwheel drives docker, hence docker-in-docker.
wheels:linux:
  stage: build
  image: docker:29
  rules:
    - if: $RENOVATE == "true"
      when: never
    - when: on_success
  services:
    - docker:29-dind
  variables:
    # The runner does not share a /certs volume between job and service, so dind
    # runs without TLS; it is only reachable on the job's own service network.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    CIBW_BUILD_VERBOSITY: "1"
  parallel:
    matrix:
      - CIBW_SKIP: ["*-musllinux_*", "*-manylinux_*"]
  before_script:
    - apk add --no-cache python3
    - python3 -m venv /opt/cibw
    - /opt/cibw/bin/pip install cibuildwheel==4.3.5
  script:
    - /opt/cibw/bin/cibuildwheel --platform linux --output-dir wheelhouse
  artifacts:
    expire_in: 1 week
    paths: [wheelhouse/]

# Sphinx site (docs/), warnings are errors; the tutorial notebook is executed during the
# build. The HTML is kept so reviewers can browse an MR's docs from the job artifacts.
docs:
  extends: .nox
  stage: build
  script:
    - nox -s docs
  artifacts:
    expire_in: 1 week
    paths: [docs/_build/html/]

# GitLab Pages: publish the docs job's build (no rebuild) from the default branch only.
pages:
  stage: deploy
  image: alpine:3.22
  needs: [docs]
  rules:
    - if: $RENOVATE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: []
  script:
    - mv docs/_build/html public
  artifacts:
    paths: [public]

# Opens and rebases the dependency MRs and the Dependency Dashboard issue. Needs the
# masked CI variables RENOVATE_TOKEN (project access token: api, write_repository,
# Developer) and GITHUB_COM_TOKEN (read-only github.com token for the pre-commit hook
# lookups and release notes). The image tag is updated by Renovate itself.
renovate:
  stage: quality
  image: ghcr.io/renovatebot/renovate:44
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"
  interruptible: false
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/.cache/renovate
    LOG_LEVEL: info
  cache:
    key: renovate
    paths: [.cache/renovate/]
  script:
    - renovate
