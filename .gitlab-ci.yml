# CI pipeline. Every job except the wheel build calls a nox session (noxfile.py), so
# CI and local runs match:  nox -s lint format typecheck cwarnings tests sanitize build
# Jobs run in the standard python images, which ship the C compiler the extension needs.
# Linux wheels (#21) are built with cibuildwheel ([tool.cibuildwheel] in pyproject.toml).
# Windows (#22) and macOS (#23) jobs need runners for those platforms (none yet).

stages: [quality, test, build]

# Merge request pipelines instead of a second push pipeline while an MR is open; branch
# pipelines (default branch, web runs) and tag pipelines are unchanged.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

default:
  image: python:3.12
  interruptible: true

variables:
  CI: "true"
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.nox:
  cache:
    key:
      files: [pyproject.toml]
      prefix: nox-$CI_JOB_NAME_SLUG
    paths: [.cache/pip/, .cache/uv/]
  before_script:
    - pip install nox uv

lint:
  extends: .nox
  stage: quality
  script:
    - nox -s lint
    - nox -s format -- --check

typecheck:
  extends: .nox
  stage: quality
  script:
    - nox -s typecheck

# Our own C files (iso_core.c, enviPat_py.c) with -Wall -Wextra -Werror; the vendored
# files' warnings are triaged in setup.py.
c-warnings:
  extends: .nox
  stage: quality
  script:
    - nox -s cwarnings

test:
  extends: .nox
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    # The image's interpreter is the only one available, so run its matching session.
    - nox -s "tests-$PYTHON_VERSION"
  coverage: '/^TOTAL\s.*?(\d+(?:\.\d+)?)%\s*$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Full test suite against an AddressSanitizer + UndefinedBehaviorSanitizer build of the
# C extension (GCC). Any finding aborts the run.
sanitize:
  extends: .nox
  stage: test
  script:
    - nox -s sanitize

build:
  extends: .nox
  stage: build
  script:
    - nox -s build
  artifacts:
    expire_in: 1 week
    paths: [dist/]

# manylinux_2_28 / musllinux_1_2 x86_64 wheels for CPython 3.10-3.13; each wheel is
# tested in its own container. cibuildwheel drives docker, hence docker-in-docker.
wheels:linux:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    CIBW_BUILD_VERBOSITY: "1"
  parallel:
    matrix:
      - CIBW_SKIP: ["*-musllinux_*", "*-manylinux_*"]
  before_script:
    - apk add --no-cache python3
    - python3 -m venv /opt/cibw
    - /opt/cibw/bin/pip install cibuildwheel==4.3.5
  script:
    - /opt/cibw/bin/cibuildwheel --platform linux --output-dir wheelhouse
  artifacts:
    expire_in: 1 week
    paths: [wheelhouse/]
